# Example configuration: java -jar target/javabourse.jar simulate --config=sim.properties
# Command line options override these values.

# correct | races | liveness
variant=correct
# for variant=liveness: DEADLOCK | LIVELOCK | GLOBAL_LOCK
bug=DEADLOCK

traders=16
symbols=AAPL,MSFT,TSLA,NVDA
# seconds
duration=10
# same seed = same trader decisions (thread interleaving is still nondeterministic)
seed=42
# max microseconds a trader waits between two actions (0 = as fast as possible)
think=200
# fair (FIFO) locks; false = faster but no fairness guarantee
fair=true
# live market view period in ms (0 = off)
live=1000
# invariant audit period while trading, in ms (correct variant only; 0 = off)
audit=500
